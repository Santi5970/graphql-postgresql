# ============================================================
# MUTATIONS — Crear, Actualizar y Eliminar datos
# Sistema: TechDist S.A.
# ============================================================
# PostGraphile genera automáticamente:
#   createEmpleado         → INSERT
#   updateEmpleado(id)     → UPDATE por nodeId
#   updateEmpleadoById     → UPDATE por id numérico
#   deleteEmpleadoById     → DELETE por id numérico
# ============================================================

# ══════════════════════════════════════════════════════════════
# EMPLEADOS
# ══════════════════════════════════════════════════════════════

# Contratar nuevo empleado
mutation ContratarEmpleado {
  createEmpleado(input: {
    empleado: {
      nombre:         "Andrea"
      apellido:       "Vargas"
      email:          "andrea.vargas@techdist.com"
      telefono:       "555-3001"
      cargo:          "Analista de Datos"
      salario:        "3200"
      fechaIngreso:   "2024-04-15"
      departamentoId: 3
      activo:         true
    }
  }) {
    empleado {
      id
      nombre
      apellido
      cargo
      salario
      departamento {
        nombre
      }
    }
  }
}

# Promover empleado (cambiar cargo y salario)
mutation PromocionEmpleado {
  updateEmpleadoById(input: {
    id: 7
    empleadoPatch: {
      cargo:   "Arquitecto de Software"
      salario: "4800"
    }
  }) {
    empleado {
      id
      nombre
      apellido
      cargo
      salario
    }
  }
}

# Dar de baja a un empleado (borrado lógico)
mutation BajaEmpleado {
  updateEmpleadoById(input: {
    id: 5
    empleadoPatch: { activo: false }
  }) {
    empleado {
      id
      nombre
      apellido
      activo
    }
  }
}

# ══════════════════════════════════════════════════════════════
# PRODUCTOS
# ══════════════════════════════════════════════════════════════

# Agregar nuevo producto al catálogo
mutation AgregarProducto {
  createProducto(input: {
    producto: {
      codigo:      "LAP-005"
      nombre:      "Laptop ASUS VivoBook 15"
      descripcion: "Intel Core i5, 8GB RAM, 512GB SSD, Windows 11 Home"
      precio:      "780"
      stock:       20
      stockMinimo: 5
      categoriaId: 1
      activo:      true
    }
  }) {
    producto {
      id
      codigo
      nombre
      precio
      stock
      categoriasProducto {
        nombre
      }
    }
  }
}

# Actualizar precio y stock tras recepción de mercancía
mutation ActualizarProducto {
  updateProductoById(input: {
    id: 1
    productoPatch: {
      precio: "899"
      stock:  30
    }
  }) {
    producto {
      id
      codigo
      nombre
      precio
      stock
    }
  }
}

# Descontinuar un producto
mutation DescontinuarProducto {
  updateProductoById(input: {
    id: 15
    productoPatch: { activo: false }
  }) {
    producto {
      id
      codigo
      nombre
      activo
    }
  }
}

