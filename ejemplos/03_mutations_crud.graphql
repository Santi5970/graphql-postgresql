# ══════════════════════════════════════════════════════════════
# PEDIDOS
# ══════════════════════════════════════════════════════════════

# Crear un nuevo pedido
mutation CrearPedido {
  createPedido(input: {
    pedido: {
      numeroPedido: "PED-2024-006"
      clienteId:    8
      empleadoId:   2
      estado:       "pendiente"
      fechaEntrega: "2024-05-01"
      notas:        "Cliente solicita factura a nombre personal"
    }
  }) {
    pedido {
      id
      numeroPedido
      estado
      fechaPedido
      cliente {
        nombre
        apellido
      }
    }
  }
}

# Agregar un producto al pedido
mutation AgregarItemPedido {
  createDetallePedido(input: {
    detallePedido: {
      pedidoId:       6
      productoId:     3
      cantidad:       2
      precioUnitario: "1250"
      descuento:      "0"
    }
  }) {
    detallePedido {
      id
      cantidad
      precioUnitario
      descuento
      subtotal
      producto {
        nombre
        codigo
      }
    }
  }
}

# Cambiar estado de un pedido a "confirmado"
mutation ConfirmarPedido {
  updatePedidoById(input: {
    id: 5
    pedidoPatch: { estado: "confirmado" }
  }) {
    pedido {
      id
      numeroPedido
      estado
      total
    }
  }
}

# Registrar envío del pedido
mutation EnviarPedido {
  updatePedidoById(input: {
    id: 4
    pedidoPatch: {
      estado:       "enviado"
      fechaEntrega: "2024-04-12"
      notas:        "Enviado vía FedEx, guía: FDX-789456123"
    }
  }) {
    pedido {
      id
      numeroPedido
      estado
      fechaEntrega
      notas
    }
  }
}

# Eliminar un ítem del detalle (borrado físico)
mutation EliminarItemPedido {
  deleteDetallePedidoById(input: { id: 1 }) {
    deletedDetallePedidoId
    detallePedido {
      cantidad
      subtotal
      producto {
        nombre
      }
    }
  }
}
